# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "The Graham–Pollak theorem"
  description: >-
    A Lean 4 / Mathlib formalization of the Graham–Pollak theorem: the edge set of the complete
    graph K_n cannot be partitioned into fewer than n − 1 complete bipartite graphs, together with
    the matching construction by n − 1 stars. Biclique decompositions are encoded by families of
    pairs of disjoint vertex sets covering every pair of distinct vertices exactly once. Mathlib
    does not contain this theorem.
  authors:
    - "Juan Pablo Traverso Gianini"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Juan Pablo Traverso Gianini"

classification:
  arxiv: ["math.CO"]
  msc2020: ["05C70", "05C50"]

sources:
  - title: "On the addressing problem for loop switching"
    authors:
      - "R. L. Graham"
      - "H. O. Pollak"
    id: "doi:10.1002/j.1538-7305.1971.tb02618.x"
    type: "paper"
    location: "Bell System Technical Journal 50 (1971), 2495–2519"
    relationship: "formalizes"
    note: "The decomposition theorem for complete graphs."
    license: "all rights reserved"
    author_endorsement: "n/a"
  - title: "On the decomposition of K_n into complete bipartite graphs"
    authors:
      - "H. Tverberg"
    id: "doi:10.1002/jgt.3190060414"
    type: "paper"
    location: "Journal of Graph Theory 6 (1982), 493–494"
    relationship: "background"
    note: "Linear-algebra proof followed here."
    license: "all rights reserved"
    author_endorsement: "n/a"

status:
  scope: >-
    Both the lower bound n − 1 (for every finite vertex type and every number of bicliques) and
    its sharpness (n ≥ 1) are proved.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "autonomous"
      models: ["Aristotle (Harmonic)"]
      framework: "Aristotle CLI"
      tool_setup: >-
        Given the formal statements and Tverberg's proof plan, Aristotle proved both theorems in
        one run (run on an alternate account). The return was audited (statements, definition and
        headers unchanged, no added axioms) and rebuilt locally.
      cost:
        wall_time: "under one hour"
        spend_usd: "not tracked"
        hardware: "API-only"
      prompting_notes: "Formal statements and proof plan supplied."
    - method: "agent"
      models: ["Claude Opus 5.5"]
      framework: "Claude Code (Anthropic)"
      tool_setup: >-
        Statement design and small-case checks, proof plan, review of the Aristotle return, and
        the Palomar packaging, checked with `lake build`, `#print axioms` and a comparison of the
        elaborated Challenge and Solution declarations (Lean v4.35.0-rc3, Mathlib
        c55e6e786f49471c72fbddbec5415808896aec1e).
      cost:
        wall_time: "about one hour"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "Natural-language instructions in Spanish, directed by the author."
  spend_usd: "subscription-based"
  notes: >-
    The result was chosen by the human author; the Lean proofs are AI-generated and mechanically
    verified (no `sorry`, axioms limited to propext, Classical.choice and Quot.sound, identical
    elaborated types and definitions for the Challenge/Solution pair).

fidelity:
  divergences: >-
    A biclique is a pair (A, B) of disjoint vertex sets (possibly empty); the decomposition
    condition counts, for each pair u ≠ v, the indices i with u ∈ A i, v ∈ B i or v ∈ A i,
    u ∈ B i, and requires exactly one. The bound is stated as n − 1 ≤ m with natural subtraction,
    which is trivial for n ≤ 1.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (AI agent in Claude Code, acting for the author)"
  notes: >-
    Agent review by Claude Opus 5.5, distinct from the mechanical verification: the agent
    compared the statements with Graham–Pollak and checked the smallest cases (n ≤ 3), checked that the statements returned by Aristotle are unchanged, and confirmed by `lake build`, `#print axioms` and a comparison of the fully
    elaborated Challenge and Solution declarations that the proofs use no `sorry` and only
    propext, Classical.choice and Quot.sound. The author directed the work and approved the
    statements. No independent human mathematical review has been performed. The result is
    classical; no mathematical novelty is claimed.

alignment:
  namespace: "GrahamPollakTheorem"
  statements:
    - source: "Graham–Pollak (1971): K_n is not a union of fewer than n − 1 edge-disjoint bicliques"
      lean: "GrahamPollakTheorem.graham_pollak"
      module: "Challenge"
      status: "proved"
    - source: "Graham–Pollak (1971): n − 1 bicliques suffice (stars)"
      lean: "GrahamPollakTheorem.exists_bicliqueDecomposition"
      module: "Challenge"
      status: "proved"

acknowledgements: >-
  Mathlib and the Lean community; Harmonic's Aristotle.
